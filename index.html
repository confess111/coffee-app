<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#3D2817">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>逸的咖啡拉花手记</title>
  <style>
    :root {
      --glass-blur: 18px;
      --glass-sat: 200%;
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --glass-hi: inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -1px 0 rgba(0,0,0,0.06), 0 0 0 1px rgba(255,255,255,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: #EFE0D0;
      color: #3D2817;
      -webkit-tap-highlight-color: rgba(0,0,0,0.08);
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }
    .app {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 14px 0;
      min-height: 100vh;
    }

    /* 头部 - 深色 + 苹果风玻璃高光 */
    .header {
      position: relative;
      background:
        linear-gradient(135deg, rgba(104,66,38,0.70) 0%, rgba(62,39,22,0.80) 100%),
        radial-gradient(circle at 82% 18%, rgba(220,166,100,0.34) 0%, transparent 48%);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      border: 1.5px solid rgba(214,176,132,0.28);
      border-radius: 28px;
      padding: 26px 26px 28px;
      box-shadow:
        0 10px 30px rgba(40,22,10,0.18),
        var(--glass-hi);
      overflow: hidden;
      overscroll-behavior: contain;
      margin-bottom: 24px;
    }
    .header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      pointer-events: none;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: 14px; right: 14px;
      width: 96px; height: 96px;
      background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 70%);
      pointer-events: none;
    }

    /* 出场动画 */
    @keyframes headerSlide {
      from { opacity: 0; transform: translateX(-110%); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes sprout {
      0%   { opacity: 0; transform: translateY(44px) scale(0.9); }
      65%  { opacity: 1; }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .header { animation: headerSlide 2.0s cubic-bezier(0.22,1,0.36,1) both; }
    .record-btn { animation: sprout 1.7s var(--ease-bounce) both; animation-delay: 0.3s; }
    .sprout { animation: sprout 1.7s var(--ease-bounce) both; }

    .title-row {
      display: flex;
      align-items: center;
      white-space: nowrap;
      margin-bottom: 12px;
    }
    .coffee-icon-top {
      width: 20px;
      height: 20px;
      margin-right: 8px;
      opacity: 0.95;
      flex-shrink: 0;
    }
    .app-title {
      font-size: 24px;
      color: #FBF3E9;
      letter-spacing: 0.8px;
      font-weight: 700;
      white-space: nowrap;
    }
    .ver-badge {
      margin-left: auto;
      font-size: 12px; font-weight: 700;
      color: #FBEEDD;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(214,176,132,0.30);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      padding: 3px 9px; border-radius: 999px;
      letter-spacing: 0.5px;
    }
    .header-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .slogan {
      font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
      font-size: 26px;
      color: #FBEEDD;
      font-weight: 700;
      line-height: 1.55;
      letter-spacing: 0.8px;
      word-break: keep-all;
      flex: 1;
      min-width: 0;
      min-height: 44px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.22);
    }
    .slogan.long { font-size: 20px; }

    .header-right {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    /* 统计卡 —— 苹果玻璃态 */
    .stat-card {
      width: 72px;
      background: linear-gradient(160deg, rgba(255,248,240,0.42) 0%, rgba(214,196,176,0.30) 100%);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      border: 1px solid rgba(74,54,38,0.22);
      border-radius: 18px;
      padding: 12px 5px 10px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      box-shadow:
        0 6px 16px rgba(61,40,23,0.16),
        var(--glass-hi);
      transition: transform 0.15s var(--ease-bounce);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .stat-card:active { transform: scale(0.94); background: linear-gradient(160deg, rgba(255,248,240,0.52), rgba(214,196,176,0.40)); }
    .stat-num {
      font-size: 27px;
      color: #F7EFE5;
      font-weight: 600;
      line-height: 1;
      margin-bottom: 6px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .stat-label {
      font-size: 11px;
      color: rgba(247,239,229,0.8);
    }

    /* 主体 */
    .body { padding: 0 4px 60px; }
    .error-tip {
      color: #C0392B;
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 8px;
      min-height: 22px;
    }
    .record-btn {
      background: linear-gradient(180deg, rgba(201,138,77,0.60) 0%, rgba(168,108,56,0.66) 100%);
      border: 1px solid rgba(74,48,30,0.30);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      border-radius: 18px;
      height: 56px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      margin-bottom: 18px;
      box-shadow:
        0 8px 20px rgba(120,80,40,0.22),
        var(--glass-hi);
      transition: transform 0.15s var(--ease-bounce), box-shadow 0.15s;
      touch-action: manipulation;
    }
    .record-btn:active { transform: translateY(1px) scale(0.99); box-shadow: 0 6px 16px rgba(120,80,40,0.28); }
    .record-plus { color: #fff; font-size: 28px; margin-right: 8px; font-weight: 300; line-height: 1; }
    .record-text { color: #fff; font-size: 17px; font-weight: 500; letter-spacing: 0.5px; }

    /* 每天卡片 */
    .day-card {
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 22px;
      box-shadow: 0 8px 28px rgba(61,40,23,0.08);
    }
    .day-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .day-info { display: flex; flex-direction: column; }
    .day-date { font-size: 22px; color: #3D2817; font-weight: 600; margin-bottom: 2px; letter-spacing: 0.5px; }
    .day-week { font-size: 13px; color: #8B6B4D; margin-bottom: 5px; }
    .day-count { font-size: 14px; color: #8B6B4D; font-weight: 500; }
    .day-delete {
      width: 30px; height: 30px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(139,107,77,0.08);
      transition: background 0.15s;
      touch-action: manipulation;
    }
    .day-delete:active { background: rgba(139,107,77,0.18); }
    .trash-icon { width: 18px; height: 18px; }

    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .photo-cell {
      position: relative;
      background: #F2E6D8;
      border-radius: 18px;
      overflow: hidden;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 4px 12px rgba(61,40,23,0.06);
    }
    .photo-fav-badge {
      position: absolute; top: 6px; right: 6px; z-index: 2;
      font-size: 18px; color: #E8455A; line-height: 1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.45); pointer-events: none;
    }
    .photo-thumb { width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer; display: block; }
    .photo-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 42px;
      padding: 0 10px;
      background: #fff;
      box-sizing: border-box;
    }
    .cup-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .cup-toggle:active { opacity: 0.55; }
    .cup-label { font-size: 13px; color: #8B6B4D; font-weight: 600; }
    .cup-icon { width: 22px; height: 22px; }
    .note-btn {
      font-size: 13px;
      color: #B87D3D;
      font-weight: 500;
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 10px;
      background: rgba(184,125,61,0.10);
      user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .note-btn:active { background: rgba(184,125,61,0.20); }
    .type-pick { display: flex; gap: 10px; margin-top: 6px; }
    #patternPick { margin-bottom: 18px; }
    .type-pick-btn {
      flex: 1;
      border: 1.5px solid #E3D6C5;
      background: #fff;
      border-radius: 12px;
      padding: 12px 0;
      font-size: 15px;
      color: #8B6B4D;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .type-pick-btn.active { background: #3D2817; color: #F7EFE5; border-color: #3D2817; }
    .type-hint { font-size: 12px; color: #8B6B4D; margin-top: 6px; }
    .type-pick-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .add-photo {
      aspect-ratio: 1;
      justify-content: center;
      cursor: pointer;
      border: 2px dashed #D4C4B0;
      background: rgba(255,255,255,0.5);
      box-shadow: none;
      touch-action: manipulation;
      position: relative;
    }
    .add-photo:active { background: rgba(255,255,255,0.8); }
    .add-file { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; z-index: 3; }
    .add-icon { font-size: 38px; color: #B87D3D; font-weight: 300; position: relative; z-index: 1; }

    .empty-state { text-align: center; color: #8B6B4D; font-size: 16px; margin-top: 80px; }

    /* 添加到主屏幕 安装条 */
    .install-bar {
      display: none;
      align-items: center; gap: 10px;
      background: rgba(61,40,23,0.95);
      -webkit-backdrop-filter: blur(var(--glass-blur)); backdrop-filter: blur(var(--glass-blur));
      color: #F7EFE5; border-radius: 14px;
      padding: 10px 12px; margin-bottom: 14px; font-size: 13px;
      box-shadow: 0 6px 20px rgba(61,40,23,0.25);
    }
    .install-bar.show { display: flex; }
    .install-text { flex: 1; line-height: 1.3; }
    .install-bar button { border: none; border-radius: 10px; padding: 7px 14px; font-size: 13px; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #installBtn { background: #B87D3D; color: #fff; font-weight: 600; }
    #installClose { background: rgba(255,255,255,0.15); color: #F7EFE5; }

    /* ===== 弹窗统一组件：底部 sheet + 淡入上滑动画 + 内部 .modal-scroll 滚动 ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30,18,10,0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity .28s ease, visibility .28s;
      overscroll-behavior: contain;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 85vh;
      background: #FBF7F2;
      border-radius: 20px;
      padding: 22px 20px 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      overscroll-behavior: contain;
      transform: translateY(24px) scale(0.98);
      transition: transform .34s var(--ease-bounce), opacity .28s ease;
      box-shadow: 0 20px 50px rgba(40,24,13,0.30);
    }
    .modal-overlay.active .modal { transform: translateY(0) scale(1); }
    .modal-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .modal-title { font-size: 19px; font-weight: 700; color: #3D2817; flex-shrink: 0; position: sticky; top: 0; background: #FBF7F2; padding: 2px 0 12px; margin-bottom: 2px; z-index: 2; }

    /* 自定义日期选择器（棕系月历） */
    .date-picker { margin-bottom: 6px; }
    .date-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 14px; }
    .date-step {
      width: 42px; height: 42px; border-radius: 50%;
      border: none; background: #EFE0D0; color: #3D2817;
      font-size: 22px; cursor: pointer; touch-action: manipulation;
    }
    .date-step:active { background: #E0CDB8; }
    .date-cur { font-size: 21px; font-weight: 700; color: #3D2817; min-width: 130px; text-align: center; }
    .date-weekheads { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
    .date-weekheads span { text-align: center; font-size: 12px; color: #8B6B4D; }
    .date-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .date-cell {
      border: none; background: #fff; border-radius: 10px;
      padding: 11px 0; font-size: 15px; color: #3D2817; font-weight: 600;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .date-cell.empty { background: transparent; cursor: default; }
    .date-cell:active { background: #E8DCCF; }
    .date-cell.active { background: #3D2817; color: #F7EFE5; }
    .date-cell.active:active { background: #3D2817; }

    /* 统计弹窗 */
    .modal-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 0; border-bottom: 1px solid rgba(139,107,77,0.15); font-size: 15px;
    }
    .modal-row:last-child { border-bottom: none; }
    .stats-summary {
      flex-shrink: 0;
      font-size: 14px;
      color: #8B6B4D;
      padding: 0 0 10px;
      margin-bottom: 2px;
      border-bottom: 1px solid rgba(139,107,77,0.15);
    }
    .stats-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      max-height: calc(5 * 54px);
    }
    .modal-row-label { color: #3D2817; font-weight: 500; }
    .modal-row-val { color: #8B6B4D; font-weight: 500; }
    .modal-btns { display: flex; gap: 12px; margin-top: 18px; flex-shrink: 0; }
    .modal-btn {
      flex: 1; height: 50px; border-radius: 16px; border: none;
      font-size: 17px; font-weight: 600; cursor: pointer; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
      transition: transform .12s var(--ease-bounce), opacity .12s;
    }
    .modal-btn.cancel { background: rgba(255,248,240,0.55); color: #3D2817; border: 1px solid rgba(74,54,38,0.18); box-shadow: var(--glass-hi); }
    .modal-btn.save { background: linear-gradient(180deg, rgba(184,125,61,0.88), rgba(168,108,56,0.94)); color: #fff; border: 1px solid rgba(74,48,30,0.25); box-shadow: var(--glass-hi); }
    .modal-btn:active { transform: scale(0.97); opacity: 0.92; }

    /* 详情弹窗 */
    .modal-photo { display: block; max-width: 100%; max-height: 46vh; width: auto; height: auto; margin: 0 auto 16px; object-fit: contain; object-position: center; background: #1c1009; border-radius: 12px; }
    .modal-label { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
    .modal-input {
      width: 100%; background: #fff; border: none; border-radius: 18px;
      padding: 16px; font-size: 16px; resize: none; outline: none; color: #3D2817;
      box-sizing: border-box; box-shadow: 0 2px 10px rgba(61,40,23,0.06);
    }
    textarea.modal-input { height: 120px; }
    .pattern-input { height: 48px; margin-bottom: 14px; }
    .modal-count { text-align: right; font-size: 13px; color: #8B6B4D; margin: 8px 0 18px; }

    /* 评价区：标签 + 收藏心（最右） */
    .modal-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .fav-heart {
      font-size: 27px; line-height: 1; color: #C9B8A6;
      padding: 2px 8px; cursor: pointer; user-select: none;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s var(--ease-bounce), color 0.15s;
    }
    .fav-heart.on { color: #E8455A; }
    .fav-heart:active { transform: scale(0.84); }

    /* 全屏大图预览 */
    .photo-viewer {
      position: fixed; inset: 0; background: rgba(0,0,0,0.96);
      display: none; align-items: center; justify-content: center; z-index: 200;
    }
    .photo-viewer.active { display: flex; }
    .viewer-img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .viewer-hint {
      position: absolute; bottom: 40px; left: 0; right: 0; text-align: center;
      color: rgba(255,255,255,0.6); font-size: 14px; pointer-events: none;
    }
    .viewer-date {
      position: absolute; top: 44px; right: 20px;
      background: rgba(0,0,0,0.5); color: #fff; font-size: 14px;
      padding: 6px 12px; border-radius: 10px; z-index: 201;
    }

    /* ===== 图鉴弹窗 ===== */
    .gallery-modal { max-height: 92vh; }
    .gallery-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-shrink: 0; }
    .gallery-title { font-size: 19px; font-weight: 700; color: #3D2817; }
    .gallery-close {
      font-size: 26px; color: #8B6B4D; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border-radius: 50%; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .gallery-close:active { background: rgba(139,107,77,0.10); }
    .gallery-tabs {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 4px;
      flex-shrink: 0; -webkit-overflow-scrolling: touch;
    }
    .gallery-tab {
      flex-shrink: 0; padding: 7px 14px; border-radius: 999px;
      background: rgba(255,248,240,0.6); border: 1px solid rgba(74,54,38,0.18);
      color: #6E4E33; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      transition: background .15s, color .15s;
    }
    .gallery-tab.active { background: #3D2817; color: #F7EFE5; border-color: #3D2817; }
    #galleryGrid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
      padding: 4px 2px 8px;
    }
    .gallery-item { will-change: transform; }
    .gallery-inner {
      background: #fff; border-radius: 18px; overflow: hidden;
      box-shadow: 0 4px 14px rgba(61,40,23,0.10); border: 1px solid rgba(255,255,255,0.6);
    }
    .gallery-inner.floating { animation: floatY 5s ease-in-out infinite; }
    @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .gallery-photo { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; cursor: pointer; }
    .gallery-cap { display: flex; align-items: center; gap: 5px; padding: 7px 9px; background: #fff; }
    .gallery-cup { width: 18px; height: 18px; flex-shrink: 0; }
    .gallery-name { font-size: 12px; color: #6E4E33; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gallery-empty { text-align: center; color: #8B6B4D; font-size: 15px; padding: 40px 0; }

    @media (max-width: 760px) {
      .header { padding: 22px 18px 24px; border-radius: 24px; }
      .app-title { font-size: 23px; }
      .slogan { font-size: 21px; line-height: 1.3; }
      .slogan.long { font-size: 18px; }
      .stat-card { width: 66px; padding: 10px 4px 9px; border-radius: 16px; }
      .stat-num { font-size: 24px; }
      .header-right { gap: 8px; }
      .body { padding: 0 2px 60px; }

    function svgToDataUrl(svg) { return 'data:image/svg+xml;base64,' + btoa(svg); }
    const COFFEE_TOP_WHITE = svgToDataUrl('<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 7h12v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V7z" stroke="#F2E6D8" stroke-width="1.7" stroke-linejoin="round"/><path d="M17 9h2a2 2 0 0 1 0 4h-2" stroke="#F2E6D8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 5h12" stroke="#F2E6D8" stroke-width="1.7" stroke-linecap="round"/></svg>');
    function getCupSvg(color, fill) {
      fill = fill || 'none';
      return svgToDataUrl(`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 7h12v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V7z" stroke="${color}" stroke-width="1.7" stroke-linejoin="round" fill="${fill}"/><path d="M17 9h2a2 2 0 0 1 0 4h-2" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 5h12" stroke="${color}" stroke-width="1.7" stroke-linecap="round"/></svg>`);
    }
    const CUP_BLACK = getCupSvg('#1A1A1A', 'rgba(30,30,30,0.12)');
    const CUP_BROWN = getCupSvg('#B87D3D');
    const TRASH_ICON = svgToDataUrl('<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 7h16M10 11v6M14 11v6M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" stroke="#8B6B4D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    document.getElementById('topCoffeeIcon').src = COFFEE_TOP_WHITE;

    const sloganEl = document.getElementById('slogan');
    const picked = SLOGANS[Math.floor(Math.random() * SLOGANS.length)];
    sloganEl.textContent = picked;
    if (picked.length > 12) sloganEl.classList.add('long');
    document.getElementById('verBadge').textContent = 'v' + APP_VERSION;

    let days = [];
    let activeDate = null;
    let activePhotoId = null;
    let activeType = 'soy';
    let activePattern = '';
    const PATTERNS = ['千层心', '树叶', '大白心'];
    let pickY = 2026, pickM = 8, pickD = 14;
    let _scrollY = 0;

    /* ---------- 存储：IndexedDB 按天拆分 + localStorage 兜底 + 损坏跳过 ---------- */
    const DB_NAME = 'cafe_latte_db', STORE = 'kv';
    const META_KEY = 'meta';            // { v:2, list: ['2026-08-14', ...] }
    const DAY_PREFIX = 'day_';          // day_2026-08-14
    const LEGACY_KEY = 'days';          // v1 单 key 旧数据
    let _db = null;
    function openDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject('no idb'); return; }
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function idbGet(db, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readonly');
        const r = tx.objectStore(STORE).get(key);
        r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error);
      });
    }
    function idbSet(db, key, val) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(val, key);
        tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
      });
    }
    function idbDel(db, key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(key);
        tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
      });
    }
    async function initStore() {
      try { _db = await openDB(); } catch { _db = null; }
    }
    async function storeGet() {
      if (_db) {
        try {
          const metaRaw = await idbGet(_db, META_KEY);
          if (metaRaw) {
            const meta = JSON.parse(metaRaw);
            if (meta && meta.v === 2 && Array.isArray(meta.list)) {
              const loaded = [], bad = [];
              for (const date of meta.list) {
                try {
                  const raw = await idbGet(_db, DAY_PREFIX + date);
                  if (raw) {
                    const day = JSON.parse(raw);
                    if (day && day.date) loaded.push(day);
                  }
                } catch { bad.push(date); }
              }
              if (bad.length) showError(`${bad.length} 天的记录损坏，已自动跳过`);
              return loaded;
            }
          }
          try {
            const raw = await idbGet(_db, LEGACY_KEY);
            if (raw) {
              const legacy = JSON.parse(raw);
              if (Array.isArray(legacy)) {
                const ok = await storeSet(legacy);
                if (ok) await idbDel(_db, LEGACY_KEY);
                return legacy;
              }
            }
          } catch {}
        } catch {}
      }
      try {
        const v = localStorage.getItem(STORAGE_KEY);
        if (v) {
          const data = JSON.parse(v);
          if (_db && Array.isArray(data)) {
            try {
              const ok = await storeSet(data);
              if (ok) localStorage.removeItem(STORAGE_KEY);
            } catch {}
          }
          return data;
        }
      } catch {}
      return null;
    }
    async function storeSet(val) {
      const str = JSON.stringify(val);
      if (_db) {
        try {
          const list = val.map(d => d.date);
          let oldList = [];
          try {
            const oldMetaRaw = await idbGet(_db, META_KEY);
            if (oldMetaRaw) {
              const oldMeta = JSON.parse(oldMetaRaw);
              if (oldMeta && Array.isArray(oldMeta.list)) oldList = oldMeta.list;
            }
          } catch {}
          const tx = _db.transaction(STORE, 'readwrite');
          const store = tx.objectStore(STORE);
          store.put(JSON.stringify({ v: 2, list }), META_KEY);
          for (const day of val) store.put(JSON.stringify(day), DAY_PREFIX + day.date);
          for (const old of oldList) {
            if (!list.includes(old)) store.delete(DAY_PREFIX + old);
          }
          await new Promise((resolve, reject) => {
            tx.oncomplete = resolve;
            tx.onerror = () => reject(tx.error || new Error('保存失败'));
            tx.onabort = () => reject(tx.error || new Error('保存被中断'));
          });
          return true;
        } catch (e) {
          showError('保存失败，存储空间可能已满，建议删掉一些旧记录');
          return false;
        }
      }
      try { localStorage.setItem(STORAGE_KEY, str); return true; }
      catch {
        showError('存储空间快满了，新照片可能存不下来，试试删掉一些旧记录');
        return false;
      }
    }

    function sortDays() { days.sort((a, b) => b.date.localeCompare(a.date)); }
    async function saveData() {
      sortDays();
      await storeSet(days);
      render();
    }
    async function loadData() {
      const data = await storeGet();
      days = Array.isArray(data) ? data : [];
      render();
    }

    function formatWeekday(y, m, d) {
      const arr = ['周日','周一','周二','周三','周四','周五','周六'];
      return arr[new Date(y, m - 1, d).getDay()];
    }
    function pad(n) { return n.toString().padStart(2, '0'); }

    function render() {
      const totalCups = days.reduce((s, d) => s + (d.photos || []).length, 0);
      document.getElementById('totalCups').textContent = totalCups;
      document.getElementById('totalDays').textContent = days.length;
      const listEl = document.getElementById('dayList');
      const emptyEl = document.getElementById('emptyState');
      if (days.length === 0) { listEl.innerHTML = ''; emptyEl.style.display = 'block'; return; }
      emptyEl.style.display = 'none';

      const animate = !window.__didAnim;
      listEl.innerHTML = days.map((day, i) => {
        const photosHtml = (day.photos || []).map((p, idx) => {
          const isReal = p.type === 'real';
          const favBadge = p.favorite ? '<span class="photo-fav-badge">♥</span>' : '';
          const patName = p.pattern ? p.pattern : '';
          const footExtra = patName ? `<span class="cup-label" style="margin-left:auto;color:#B87D3D;">${patName}</span>` : '';
          return `
          <div class="photo-cell">
            ${favBadge}
            <img class="photo-thumb" src="${p.src}" alt="" data-date="${day.date}" data-idx="${idx}">
            <div class="photo-foot">
              <div class="cup-toggle" data-date="${day.date}" data-id="${p.id}">
                <img class="cup-icon" src="${isReal ? CUP_BLACK : CUP_BROWN}" alt="">
                <span class="cup-label">${isReal ? '真咖啡' : '酱油'}</span>
              </div>
              ${footExtra}
              <div class="note-btn" data-date="${day.date}" data-id="${p.id}">评价</div>
            </div>
          </div>`;
        }).join('');

        return `
          <div id="day-${day.date}" class="day-card ${animate ? 'sprout' : ''}" style="${animate ? `animation-delay:${i * 0.09}s` : ''}">
            <div class="day-card-head">
              <div class="day-info">
                <div class="day-date">${day.date}</div>
                <div class="day-week">${day.weekday || ''}</div>
                <div class="day-count">${day.photos.length} 杯</div>
              </div>
              <div class="day-delete" data-date="${day.date}">
                <img class="trash-icon" src="${TRASH_ICON}" alt="删除">
              </div>
            </div>
            <div class="photo-grid">
              ${photosHtml}
              <div class="photo-cell add-photo" data-date="${day.date}">
                <input type="file" class="add-file" accept="image/*" data-date="${day.date}">
                <span class="add-icon">+</span>
              </div>
            </div>
          </div>`;
      }).join('');

      listEl.querySelectorAll('.add-file').forEach(el => el.addEventListener('change', handleFile));
      listEl.querySelectorAll('.day-delete').forEach(el => el.addEventListener('click', () => {
        if (confirm(`删除 ${el.dataset.date} 的记录？`)) { days = days.filter(d => d.date !== el.dataset.date); saveData(); }
      }));
      listEl.querySelectorAll('.cup-toggle').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.date, el.dataset.id)));
      listEl.querySelectorAll('.note-btn').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.date, el.dataset.id)));
      listEl.querySelectorAll('.photo-thumb').forEach(el => el.addEventListener('click', () => openPhotoViewer(el.dataset.date, parseInt(el.dataset.idx, 10))));

      window.__didAnim = true;
    }

    /* 弹窗统一打开/关闭：position:fixed 锁背景（iOS 彻底锁住不跟着动） */
    function lockBody() {
      _scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
      const b = document.body, h = document.documentElement;
      b.style.position = 'fixed';
      b.style.top = `-${_scrollY}px`;
      b.style.left = '0';
      b.style.right = '0';
      b.style.width = '100%';
      h.style.overflow = 'hidden';
    }
    function unlockBody() {
      const b = document.body, h = document.documentElement;
      b.style.position = '';
      b.style.top = '';
      b.style.left = '';
      b.style.right = '';
      b.style.width = '';
      h.style.overflow = '';
      window.scrollTo(0, _scrollY);
    }
    function openModal(id) {
      lockBody();
      document.getElementById(id).classList.add('active');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      unlockBody();
    }

    /* ---------- 自定义日期选择器（月历） ---------- */
    function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
    function renderCalendar() {
      document.getElementById('calCur').textContent = `${pickY}年${pickM}月`;
      const g = document.getElementById('calGrid'); g.innerHTML = '';
      const first = new Date(pickY, pickM - 1, 1).getDay();
      const max = daysInMonth(pickY, pickM);
      for (let i = 0; i < first; i++) {
        const e = document.createElement('div'); e.className = 'date-cell empty'; g.appendChild(e);
      }
      for (let d = 1; d <= max; d++) {
        const b = document.createElement('button'); b.type = 'button';
        b.className = 'date-cell' + (d === pickD ? ' active' : '');
        b.textContent = d;
        b.addEventListener('click', () => { pickD = d; renderCalendar(); });
        g.appendChild(b);
      }
    }
    function openDatePicker() {
      const t = new Date();
      pickY = t.getFullYear(); pickM = t.getMonth() + 1; pickD = t.getDate();
      renderCalendar();
      openModal('dateModal');
    }
    function closeDatePicker() { closeModal('dateModal'); }
    function scrollToDay(date) {
      const el = document.getElementById('day-' + date);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function confirmDate() {
      const dateStr = `${pickY}-${pad(pickM)}-${pad(pickD)}`;
      if (days.some(d => d.date === dateStr)) { showError('这一天已经记录过了'); closeDatePicker(); return; }
      days.push({ date: dateStr, weekday: formatWeekday(pickY, pickM, pickD), photos: [] });
      saveData(); showError(''); closeDatePicker();
      setTimeout(() => scrollToDay(dateStr), 60);
    }

    /* ---------- 图片压缩后存储（防崩核心） ---------- */
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > COMPRESS_MAX || h > COMPRESS_MAX) {
              if (w >= h) { h = Math.round(h * COMPRESS_MAX / w); w = COMPRESS_MAX; }
              else { w = Math.round(w * COMPRESS_MAX / h); h = COMPRESS_MAX; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', COMPRESS_QUALITY));
          };
          img.onerror = reject; img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    async function handleFile(e) {
      const file = e.target.files[0];
      const date = e.target.dataset.date;
      if (!file || !date) { e.target.value = ''; return; }
      if (file.size > 30 * 1024 * 1024) { showError('图片太大了，换一张试试（建议 < 30MB）'); e.target.value = ''; return; }
      showError('保存中…');
      let src;
      try { src = await compressImage(file); }
      catch { showError('图片读取失败，换一张试试'); e.target.value = ''; return; }
      const day = days.find(d => d.date === date);
      if (!day) { e.target.value = ''; return; }
      day.photos.push({ id: Date.now().toString(), src, note: '', type: 'soy', pattern: '' });
      await saveData();
      showError('');
      e.target.value = '';
      scrollToDay(date);
    }

    function openPhotoViewer(date, idx) {
      const day = days.find(d => d.date === date);
      if (!day || idx < 0 || idx >= day.photos.length) return;
      document.getElementById('viewerImg').src = day.photos[idx].src;
      document.getElementById('viewerDate').style.display = 'none';
      openModal('photoViewer');
    }
    function closePhotoViewer() { closeModal('photoViewer'); document.getElementById('viewerImg').src = ''; }

    function openDetail(date, id) {
      const day = days.find(d => d.date === date);
      const photo = day ? day.photos.find(p => p.id === id) : null;
      if (!photo) return;
      activeDate = date; activePhotoId = id;
      document.getElementById('modalPhoto').src = photo.src;
      document.getElementById('modalInput').value = photo.note || '';
      document.getElementById('modalCount').textContent = (photo.note || '').length;
      activePattern = photo.pattern || '';
      document.getElementById('patternPick').querySelectorAll('.type-pick-btn').forEach(x => x.classList.toggle('active', x.dataset.pat === activePattern));
      activeType = photo.type || 'soy';
      document.getElementById('pickReal').classList.toggle('active', activeType === 'real');
      document.getElementById('pickSoy').classList.toggle('active', activeType === 'soy');
      const favHeart = document.getElementById('favHeart');
      favHeart.classList.toggle('on', !!photo.favorite);
      favHeart.textContent = photo.favorite ? '♥' : '♡';
      const tc = photo.typeChanges || 0;
      const hint = document.getElementById('typeHint');
      const realBtn = document.getElementById('pickReal');
      const soyBtn = document.getElementById('pickSoy');
      if (tc >= 3) {
        realBtn.disabled = true; soyBtn.disabled = true;
        hint.textContent = '类型已锁定（已达 3 次上限）';
      } else {
        realBtn.disabled = false; soyBtn.disabled = false;
        hint.textContent = `还可修改 ${3 - tc} 次`;
      }
      openModal('detailModal');
    }
    function closeDetail() {
      closeModal('detailModal');
      if (activeDate) scrollToDay(activeDate);
      activeDate = null; activePhotoId = null;
    }
    function saveDetail() {
      if (!activeDate || !activePhotoId) return;
      const day = days.find(d => d.date === activeDate);
      const photo = day ? day.photos.find(p => p.id === activePhotoId) : null;
      if (photo) {
        photo.note = document.getElementById('modalInput').value;
        photo.pattern = activePattern;
        photo.favorite = document.getElementById('favHeart').classList.contains('on');
        if (photo.type !== activeType) {
          if ((photo.typeChanges || 0) >= 3) {
            showError('类型已锁定（最多改 3 次）');
          } else {
            photo.typeChanges = (photo.typeChanges || 0) + 1;
            photo.type = activeType;
          }
        }
        saveData();
      }
      closeDetail();
    }
    function showError(msg) { document.getElementById('errorTip').textContent = msg; }

    /* ---------- 统计弹窗 ---------- */
    function openCupsStats() {
      const total = days.reduce((s, d) => s + (d.photos || []).length, 0);
      const real = days.reduce((s, d) => s + (d.photos || []).filter(p => p.type === 'real').length, 0);
      const soy = total - real;
      const summary =
        `<div class="modal-row"><span class="modal-row-label">合计</span><span class="modal-row-val">${total} 杯（咖啡 ${real} / 酱油 ${soy}）</span></div>`;
      const rows = days.map(day => {
        const t = day.photos.length;
        const r = day.photos.filter(p => p.type === 'real').length;
        const s = t - r;
        return `<div class="modal-row"><span class="modal-row-label">${day.date} ${day.weekday || ''}</span><span class="modal-row-val">${t} 杯（咖啡 ${r} / 酱油 ${s}）</span></div>`;
      }).join('');
      document.getElementById('statsTitle').textContent = '总杯数明细';
      document.getElementById('statsSummary').innerHTML = summary;
      document.getElementById('statsContent').innerHTML = rows || '<div class="modal-row"><span class="modal-row-label">暂无记录</span></div>';
      openModal('statsModal');
    }
    function openDaysStats() {
      document.getElementById('statsTitle').textContent = '总天数明细';
      document.getElementById('statsSummary').innerHTML = '';
      const rows = days.map(day => {
        const total = day.photos.length;
        const real = day.photos.filter(p => p.type === 'real').length;
        const soy = total - real;
        return `<div class="modal-row"><span class="modal-row-label">${day.date} ${day.weekday || ''}</span><span class="modal-row-val">共 ${total} 杯（咖啡 ${real} / 酱油 ${soy}）</span></div>`;
      }).join('');
      document.getElementById('statsContent').innerHTML = rows || '<div class="modal-row"><span class="modal-row-label">暂无记录</span></div>';
      openModal('statsModal');
    }
    function closeStats() { closeModal('statsModal'); }

    /* ---------- 图鉴（v3 完整需求） ---------- */
    const DEFAULT_PATTERN_ICONS = ['❤️', '🍃', '⭐'];
    function defaultPatternName(id) {
      let h = 0;
      const s = String(id || '');
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffffffff;
      return DEFAULT_PATTERN_ICONS[Math.abs(h) % DEFAULT_PATTERN_ICONS.length];
    }
    function patternIcon(pat) {
      const m = { '千层心': '❤️', '树叶': '🍃', '大白心': '💛' };
      return m[pat] || '❤️';
    }
    function collectGalleryItems() {
      const arr = [];
      days.forEach(day => (day.photos || []).forEach(p => {
        if (p.type) {
          arr.push({
            src: p.src, type: p.type, date: day.date,
            pattern: p.pattern || '',
            favorite: !!p.favorite,
            name: p.pattern || ''
          });
        }
      }));
      return arr;
    }
    function renderGalleryTabs() {
      const tabs = ['全部', ...PATTERNS];
      const wrap = document.getElementById('galleryTabs');
      wrap.innerHTML = tabs.map(t => `<div class="gallery-tab${t === '全部' ? ' active' : ''}" data-tab="${t}">${t}</div>`).join('');
      wrap.querySelectorAll('.gallery-tab').forEach(el => el.addEventListener('click', () => {
        wrap.querySelectorAll('.gallery-tab').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        renderGallery(el.dataset.tab);
      }));
    }
    function renderGallery(filter) {
      const grid = document.getElementById('galleryGrid');
      let items = collectGalleryItems();
      let scattered = false;
      if (filter && filter !== '全部') {
        items = items.filter(it => it.pattern === filter);
        items.sort((a, b) => b.date.localeCompare(a.date)); // 新在前
      } else {
        scattered = true;
      }
      if (!items.length) {
        grid.innerHTML = '<div class="gallery-empty">还没有可收集的拉花，去「评价」里标记一杯吧</div>';
        return;
      }
      grid.innerHTML = items.map((it, i) => {
        const cup = it.type === 'real' ? CUP_BLACK : CUP_BROWN;
        let extra = '';
        if (it.pattern) extra = `<span class="gallery-name">${patternIcon(it.pattern)} ${it.name}</span>`;
        else if (it.favorite) extra = `<span class="gallery-name">❤️ 收藏</span>`;
        return `<div class="gallery-item" data-i="${i}">
          <div class="gallery-inner">
            <img class="gallery-photo" src="${it.src}" alt="" data-i="${i}">
            <div class="gallery-cap">
              <img class="gallery-cup" src="${cup}" alt="">
              ${extra}
            </div>
          </div>
        </div>`;
      }).join('');
      grid.querySelectorAll('.gallery-photo').forEach(el => el.addEventListener('click', () => {
        const it = items[parseInt(el.dataset.i, 10)];
        openGalleryPhoto(it.src, it.date);
      }));
      if (scattered) {
        const els = Array.from(grid.querySelectorAll('.gallery-item'));
        els.forEach(el => {
          const rx = Math.random() * 240 - 120;
          const ry = Math.random() * 240 - 120;
          const rr = Math.random() * 50 - 25;
          el.style.transition = 'none';
          el.style.transform = `translate(${rx}px, ${ry}px) rotate(${rr}deg)`;
          el.style.opacity = '0';
        });
        requestAnimationFrame(() => requestAnimationFrame(() => {
          els.forEach(el => {
            el.style.transition = 'transform .9s cubic-bezier(0.22,1,0.36,1), opacity .6s ease';
            el.style.transform = 'translate(0,0) rotate(0deg)';
            el.style.opacity = '1';
          });
          const FLOAT_LIMIT = 24;
          setTimeout(() => els.forEach(el => {
            const inner = el.querySelector('.gallery-inner');
            if (inner && items.length <= FLOAT_LIMIT) inner.classList.add('floating');
          }), 950);
        }));
      } else {
        grid.querySelectorAll('.gallery-inner').forEach(el => el.classList.add('floating'));
      }
    }
    function openGallery() {
      renderGalleryTabs();
      renderGallery('全部');
      openModal('galleryModal');
    }
    function closeGallery() { closeModal('galleryModal'); }
    function openGalleryPhoto(src, date) {
      document.getElementById('viewerImg').src = src;
      const dv = document.getElementById('viewerDate');
      dv.textContent = date;
      dv.style.display = 'block';
      openModal('photoViewer');
    }

    /* ---------- 事件绑定 ---------- */
    document.getElementById('recordBtn').addEventListener('click', openDatePicker);
    document.getElementById('dateConfirm').addEventListener('click', confirmDate);
    document.getElementById('dateCancel').addEventListener('click', closeDatePicker);
    document.getElementById('dateModal').addEventListener('click', (e) => { if (e.target.id === 'dateModal') closeDatePicker(); });
    document.getElementById('calPrev').addEventListener('click', () => { pickM--; if (pickM < 1) { pickM = 12; pickY--; } renderCalendar(); });
    document.getElementById('calNext').addEventListener('click', () => { pickM++; if (pickM > 12) { pickM = 1; pickY++; } renderCalendar(); });
    document.getElementById('modalCancel').addEventListener('click', closeDetail);
    function pickType(type) {
      if (type === activeType) return;
      activeType = type;
      document.getElementById('pickReal').classList.toggle('active', type === 'real');
      document.getElementById('pickSoy').classList.toggle('active', type === 'soy');
    }
    document.getElementById('pickReal').addEventListener('click', () => pickType('real'));
    document.getElementById('pickSoy').addEventListener('click', () => pickType('soy'));
    document.getElementById('patternPick').querySelectorAll('.type-pick-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const pat = btn.dataset.pat;
        if (activePattern === pat) { activePattern = ''; btn.classList.remove('active'); }
        else {
          activePattern = pat;
          document.getElementById('patternPick').querySelectorAll('.type-pick-btn').forEach(x => x.classList.remove('active'));
          btn.classList.add('active');
        }
      });
    });
    document.getElementById('modalSave').addEventListener('click', saveDetail);
    document.getElementById('favHeart').addEventListener('click', () => {
      const h = document.getElementById('favHeart');
      const on = h.classList.toggle('on');
      h.textContent = on ? '♥' : '♡';
    });
    document.getElementById('modalInput').addEventListener('input', (e) => { document.getElementById('modalCount').textContent = e.target.value.length; });
    document.getElementById('detailModal').addEventListener('click', (e) => { if (e.target.id === 'detailModal') closeDetail(); });
    document.getElementById('totalCupsCard').addEventListener('click', openCupsStats);
    document.getElementById('totalDaysCard').addEventListener('click', openDaysStats);
    document.getElementById('statsClose').addEventListener('click', closeStats);
    document.getElementById('statsModal').addEventListener('click', (e) => { if (e.target.id === 'statsModal') closeStats(); });
    document.getElementById('photoViewer').addEventListener('click', closePhotoViewer);
    document.getElementById('galleryBtn').addEventListener('click', openGallery);
    document.getElementById('galleryClose').addEventListener('click', closeGallery);
    document.getElementById('galleryModal').addEventListener('click', (e) => { if (e.target.id === 'galleryModal') closeGallery(); });

    /* ---------- 头部：复制备份 / 恢复备份 ---------- */
    function setBackupHint(msg, ok) {
      const el = document.getElementById('backupHint');
      if (el) { el.textContent = msg || ''; el.style.color = ok ? '#2e7d32' : '#8B6B4D'; }
    }
    function backupJSON() {
      return JSON.stringify({ v: 2, app: 'cafe-latte', version: APP_VERSION, exportedAt: new Date().toISOString(), days: days });
    }
    function countCups(arr) { return arr.reduce((s, d) => s + ((d.photos || []).length), 0); }
    function copyBackup() {
      const txt = backupJSON();
      const done = (ok) => {
        if (ok) setUpgradeStatus('已复制备份 ✓ ' + days.length + ' 天 / ' + countCups(days) + ' 杯，去备忘录粘贴保存', true);
        else setUpgradeStatus('自动复制失败，请用「恢复」窗口里的文本手动复制', false);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => done(true)).catch(() => done(false));
      } else {
        const ta = document.createElement('textarea');
        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        done(ok);
      }
    }
    function openRestore() {
      document.getElementById('backupText').value = '';
      setBackupHint('当前已有 ' + days.length + ' 天记录，恢复会整体替换', false);
      openModal('backupModal');
    }
    document.getElementById('copyBtn').addEventListener('click', copyBackup);
    document.getElementById('restoreBtn').addEventListener('click', openRestore);
    document.getElementById('backupClose').addEventListener('click', () => closeModal('backupModal'));
    document.getElementById('backupModal').addEventListener('click', (e) => { if (e.target.id === 'backupModal') closeModal('backupModal'); });
    document.getElementById('backupRestore').addEventListener('click', async () => {
      const raw = (document.getElementById('backupText').value || '').trim();
      if (!raw) { setBackupHint('先粘贴备份文本', false); return; }
      let data = null;
      try {
        const o = JSON.parse(raw);
        data = Array.isArray(o) ? o : (o && Array.isArray(o.days) ? o.days : null);
      } catch (e) { setBackupHint('文本格式不对，恢复失败', false); return; }
      if (!data) { setBackupHint('没找到记录数据，恢复失败', false); return; }
      const clean = data.filter(d => d && d.date);
      if (!clean.length) { setBackupHint('备份里没有有效记录', false); return; }
      if (days.length && !confirm('将用备份的 ' + clean.length + ' 天替换当前 ' + days.length + ' 天，确定？')) return;
      days = clean;
      await saveData();
      closeModal('backupModal');
      setUpgradeStatus('已恢复 ' + days.length + ' 天 / ' + countCups(days) + ' 杯 ✓', true);
    });

    /* ---------- PWA：注册 service worker + 一键升级 ---------- */
    let swReg = null;
    const upgradeStatusEl = document.getElementById('upgradeStatus');
    function setUpgradeStatus(msg, ok) {
      if (upgradeStatusEl) {
        upgradeStatusEl.textContent = msg || '';
        upgradeStatusEl.style.color = ok ? '#2e7d32' : '#8B6B4D';
      }
    }
    function activateWaiting(reg) {
      if (!reg || !reg.waiting) return false;
      try { sessionStorage.setItem('justUpgraded', APP_VERSION); } catch (e) {}
      reg.waiting.postMessage({ type: 'SKIP_WAITING' });
      return true;
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').then((reg) => {
          swReg = reg;
          if (reg.waiting) setUpgradeStatus('有新版本可用，点「升级」应用 ✨', false);
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                setUpgradeStatus('有新版本可用，点「升级」应用 ✨', false);
              }
            });
          });
          setInterval(() => { reg.update().catch(() => {}); }, 30 * 60 * 1000);
        }).catch(() => {});
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => { window.location.reload(); });
    }
    document.getElementById('upgradeBtn').addEventListener('click', async () => {
      const btn = document.getElementById('upgradeBtn');
      btn.disabled = true;
      setUpgradeStatus('正在连接主控端检查更新…', false);
      try {
        let reg = swReg;
        if (!reg) reg = await navigator.serviceWorker.getRegistration();
        if (!reg) {
          setUpgradeStatus('已是最新 v' + APP_VERSION + '，你的 ' + (days ? days.length : 0) + ' 天内容原样保留 ✓', true);
          btn.disabled = false;
          return;
        }
        await reg.update();
        if (activateWaiting(reg)) {
          setUpgradeStatus('正在升级到最新壳…', false);
          setTimeout(() => { window.location.reload(); }, 1500);
        } else {
          // SW 未变化但仍强制刷新一次页面：确保只改了 index.html 时也能拉到最新内容
          setUpgradeStatus('正在刷新页面获取最新…', false);
          setTimeout(() => { window.location.reload(); }, 800);
        }
      } catch (e) {
        setUpgradeStatus('升级检查失败，稍后重试', false);
        btn.disabled = false;
      }
    });

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBar').classList.add('show');
    });
    const installBar = document.getElementById('installBar');
    document.getElementById('installBtn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        try { await deferredPrompt.userChoice; } catch {}
        deferredPrompt = null;
        installBar.classList.remove('show');
      }
    });
    document.getElementById('installClose').addEventListener('click', () => installBar.classList.remove('show'));

    (async function () {
      await initStore();
      await loadData();
      document.getElementById('footerVer').textContent = '逸的咖啡拉花手记 · v' + APP_VERSION;
      try {
        if (sessionStorage.getItem('justUpgraded')) {
          sessionStorage.removeItem('justUpgraded');
          showError('✅ 已升级到 v' + APP_VERSION + '，内容原样保留');
        }
      } catch (e) {}
    })();
  </script>
</body>
